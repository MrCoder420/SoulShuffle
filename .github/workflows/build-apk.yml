name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Required for Expo SDK 54 / RN 0.81)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🤖 Pre-accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" >> $ANDROID_HOME/licenses/android-googletv-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" >> $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" >> $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "79120722343a6f314e0719f863036c702b0e6b2a" >> $ANDROID_HOME/licenses/android-googlexr-license

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Keystore
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android/app
          # Copy the committed permanent release keystore
          cp ../../release.keystore release.keystore
          
          # Inject release signing config into android/app/build.gradle
          node -e '
            const fs = require("fs");
            let gradle = fs.readFileSync("build.gradle", "utf8");
            const releaseConfig = `
                  release {
                      storeFile file("release.keystore")
                      storePassword "couplegame123"
                      keyAlias "couplegame"
                      keyPassword "couplegame123"
                  }
            `;
            gradle = gradle.replace(/signingConfigs\s*\{/, "signingConfigs {\n" + releaseConfig);
            gradle = gradle.replace(/signingConfig\s+signingConfigs\.debug/g, "signingConfig signingConfigs.release");
            fs.writeFileSync("build.gradle", gradle, "utf8");
          '

      - name: 🔨 Build Standalone APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: 🔍 Find and Package Built APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Built APK at: $APK_FILE"
          mkdir -p output_apk
          cp "$APK_FILE" output_apk/CoupleGame.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulShuffle-CoupleGame-APK
          path: output_apk/CoupleGame.apk
          retention-days: 30
