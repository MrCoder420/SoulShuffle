name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔨 Build iOS App (Unsigned for Sideloading)
        run: |
          cd ios
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            CONFIGURATION="Debug"
          else
            CONFIGURATION="Release"
          fi
          
          xcodebuild \
            -workspace SoulShuffle.xcworkspace \
            -scheme SoulShuffle \
            -configuration $CONFIGURATION \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: 📦 Package into .ipa
        run: |
          cd ios
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            APP_DIR="build/Build/Products/Debug-iphoneos"
          else
            APP_DIR="build/Build/Products/Release-iphoneos"
          fi
          
          cd $APP_DIR
          mkdir -p Payload
          mv SoulShuffle.app Payload/
          zip -r SoulShuffle.ipa Payload/

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulShuffle-iOS-IPA
          path: ios/build/Build/Products/*-iphoneos/SoulShuffle.ipa
          retention-days: 30
